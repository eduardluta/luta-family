# Familja Luta — suggestions API.
#
# Deploy (see ../docs/DEPLOY.md for the full walkthrough):
#   npx wrangler d1 create luta-family        # paste the returned id below
#   npx wrangler d1 execute luta-family --remote --file=./schema.sql
#   npx wrangler kv namespace create IMAGES   # paste the returned id below
#   npx wrangler secret put ADMIN_TOKEN       # a long random string
#   npx wrangler secret put IP_SALT           # any long random string
#   npx wrangler deploy

name = "luta-family-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# Origins allowed to call this API. The first is used when a request carries no
# Origin header. Keep localhost while developing; drop it before going live.
ALLOWED_ORIGINS = "https://luta.family,https://www.luta.family,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "luta-family"
database_id = "f3e8bad5-e4ba-46d5-832e-18a3f31161f7"

# Photographs attached to suggestions. KV rather than R2 deliberately: R2 asks
# for a payment method even on its free tier, KV does not, and a family archive
# will never approach KV's free limits (1 GB, 1,000 writes/day).
[[kv_namespaces]]
binding = "IMAGES"
id = "e640ff243e5a446fb22028c6e9c7b771"

# ADMIN_TOKEN and IP_SALT are secrets, never vars — set them with
# `wrangler secret put`, so they stay out of this file and out of git.

# Served at api.luta.family. Cloudflare creates and manages the DNS record for a
# custom domain itself — do not add one by hand in the DNS tab.
[[routes]]
pattern = "api.luta.family"
custom_domain = true
